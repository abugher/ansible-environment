---
- name:                         'install packages'
  apt:
    name:                       "{{ install_packages }}"
    state:                      'present'
  register:                     install_packages_plain_result
  retries:                      5
  delay:                        120
  until:                        install_packages_plain_result is not failed
  when:                         install_packages_from_release is not defined
                                and install_packages_with_apt is not defined

- name:                         'install packages from release'
  apt:
    name:                       "{{ install_packages }}"
    state:                      'present'
    default_release:            "{{ install_packages_from_release }}"
  register:                     install_packages_from_release_result
  retries:                      5
  delay:                        120
  until:                        install_packages_from_release_result is not failed
  when:                         install_packages_from_release is defined
                                and install_packages_with_apt is not defined

- name:                         'install packages with apt'
  command:                      "apt install {{ install_packages|join(' ') }}"
  register:                     install_packages_with_apt_result
  retries:                      5
  delay:                        120
  until:                        install_packages_with_apt_result is not failed
  changed_when:                 install_packages_with_apt_result.stdout.find(' 0 newly installed') == -1
  when:                         install_packages_from_release is not defined
                                and hostvars[inventory_hostname]['install_packages_with_apt'] is defined
                                and hostvars[inventory_hostname]['install_packages_with_apt']

- name:                         'install packages with apt from release'
  command:                      "apt install -t '{{ install_packages_from_release }}' {{ install_packages|join(' ') }}"
  register:                     install_packages_with_apt_from_release_result
  retries:                      5
  delay:                        120
  until:                        install_packages_with_apt_from_release_result is not failed
  changed_when:                 install_packages_with_apt_from_release_result.stdout.find(' 0 newly installed') == -1
  when:                         install_packages_from_release is defined
                                and hostvars[inventory_hostname]['install_packages_with_apt'] is defined
                                and hostvars[inventory_hostname]['install_packages_with_apt']

- name:                         "install packages - register result"
  set_fact:
    install_packages_result:    "{{ install_packages_plain_result if install_packages_plain_result is not skipped else install_packages_from_release_result if install_packages_from_release_result is not skipped else install_packages_with_apt_result if install_packages_with_apt_result is not skipped else install_packages_with_apt_from_release_result if install_packages_with_apt_from_release_result is not skipped else False }}"
