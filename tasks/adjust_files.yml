---
- name:                         'adjust files'
  file:
    owner:                      "{{ item.owner }}"
    group:                      "{{ item.group }}"
    mode:                       "{{ item.mode }}"
    path:                       "{{ item.path }}"
    recurse:                    "{{ item.recurse|default(False) }}"
  with_items:                   "{{ adjust_files }}"
  register:                     adjust_files_result

