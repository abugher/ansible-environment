[defaults]
# If these paths are updated, lib/paths.sh may also need to be updated.
inventory                       = bin/inventory
roles_path                      = ../ansible-roles

remote_tmp                      = $HOME/.ansible/tmp
pattern                         = *
forks                           = 10
poll_interval                   = 15
ansible_python_interpreter      = '/usr/bin/python3'
gathering                       = explicit
timeout                         = 10
# Deprecated, but still necessary.  jinja2.ext.loopcontrols allows `break` in
# templates, which is still in use.  Not sure about the other extensions.
#
# Documentation:  https://docs.ansible.com/projects/ansible/latest/reference_appendices/config.html#default-jinja2-extensions
jinja2_extensions               = jinja2.ext.do,jinja2.ext.i18n,jinja2.ext.loopcontrols
action_plugins                  = /usr/share/ansible_plugins/action_plugins
callback_plugins                = /usr/share/ansible_plugins/callback_plugins
connection_plugins              = /usr/share/ansible_plugins/connection_plugins
lookup_plugins                  = /usr/share/ansible_plugins/lookup_plugins
vars_plugins                    = /usr/share/ansible_plugins/vars_plugins
filter_plugins                  = /usr/share/ansible_plugins/filter_plugins
fact_caching                    = memory
retry_files_enabled             = False
bin_ansible_callbacks           = True
# Group names contain dashes.
force_valid_group_names         = ignore

[privilege_escalation]
become                          = True
become_method                   = 'sudo'
become_user                     = 'root'

[paramiko_connection]

[ssh_connection]

pipelining                      = True
# This should match ControlPath in the ssh-client role.
control_path                    = '/tmp/%%u.%%C'
usetty                          = False

[selinux]
