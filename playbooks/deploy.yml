---
- name:                 "Deploy!"
  connection:           "{{ connection|default('ssh') }}"
  remote_user:          "{{ ansible_remote_user|default(hostvars[inventory_hostname]['ansible_remote_user']|default('ansible')) }}"
  become:               "{{ hostvars[inventory_hostname]['ansible_become']|default(True) }}"
  become_method:        "{{ hostvars[inventory_hostname]['ansible_become_method']|default('sudo') }}"
  gather_facts:         "{{ gather_facts|default('no') }}"
  hosts:                "{{ target_hosts }}"
  # https://stackoverflow.com/questions/42947301/ansible-multiple-roles
  #roles:                "{{ target_roles }}"
  tasks:
    - include_role:
        name:           "{{ target_role }}"
      with_items:       "{{ target_roles }}"
      loop_control:
        loop_var:       'target_role'
